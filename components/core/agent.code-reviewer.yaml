# Coordinate: core/agent.code-reviewer
# component_type: Agent  (Operational Component — Domain Model §3)
# Base normativa: Agent Architecture v1.0.0

identity: core/agent.code-reviewer
version: 1.0.0
component_type: Agent
lifecycle_state: Active
owner: role.governance-area.code-quality.steward
purpose: >
  Ocupar o Role de Reviewer sobre Pull Requests, interpretar o relatório
  produzido pela Skill de análise estática e decidir aprovação ou
  solicitação de mudanças.

inputs:
  - name: review_report
    type: artifact/json
    required: true

outputs:
  - name: review_decision
    type: artifact/json

capabilities:
  - role-eligibility.reviewer          # Agent §5.1 — elegibilidade expressa como Capability
  - orchestration.code-review

constraints:
  - name: max-autonomous-risk-tier
    kind: ENUM
    field: role_class.risk_tier
    values: [BAIXO, MEDIO]
    description: >
      Acima de MEDIO, toda Decision autorizada por este Agent MUST ser
      coautorizada por Role humano (AG4, Agent Architecture §7).

metadata:
  standards_bound:
    - standard: core/standard.governance.agent-decision-integrity@1.0.0
      level: BASE                      # vinculação LOCAL e explícita (Kernel §2.14) —
                                        # distinta da vinculação DERIVADA por Policy usada
                                        # pela Skill (Policy §2.1); os dois mecanismos
                                        # coexistem no mesmo repositório, sem conflito

templates:
  - local_id: prompt.decision
    kind: PROMPT
    deterministic_expansion: true
    variables:
      - name: review_report
        type: object
        required: true
        binding_source: PARAMETER
    content: |
      Com base no relatório de revisão abaixo, decida: APPROVE ou
      REQUEST_CHANGES. Nunca aprove se existir achado de severidade
      "blocker" pendente.

      Relatório: {{review_report}}

  - local_id: output.decision
    kind: OUTPUT
    deterministic_expansion: true
    variables:
      - name: verdict
        type: string
        required: true
        binding_source: PARAMETER
      - name: rationale
        type: string
        required: true
        binding_source: PARAMETER
      - name: decided_at
        type: timestamp
        required: true
        binding_source: CONTEXT
    content: |
      {
        "verdict": "{{verdict}}",
        "rationale": "{{rationale}}",
        "decided_at": "{{decided_at}}"
      }

# test_suite[] — Testing Architecture §5.2. Validation & Certification §7 já
# nomeava, para Agent, "cenários comportamentais representativos; L4 exige
# avaliação humana" — os dois casos abaixo cobrem exatamente isso: um caso
# determinístico (rejeita autoaprovação, verificável por predicado puro) e um
# caso de HUMAN_REVIEW (comportamento sob ambiguidade, único caso do
# repositório a exercitar Assertion.kind=HUMAN_REVIEW até agora).
test_suite:
  - local_id: test.rejects-blocker-approval
    kind: FUNCTIONAL
    generated_by: MANUAL
    input:
      review_report: { findings: [{ severity: "blocker", category: "secret" }] }
    assertion:
      kind: PREDICATE
      predicate: "verdict == 'REQUEST_CHANGES'"
    covers:
      - "core/standard.governance.agent-decision-integrity@1.0.0#nr.rationale-references-evidence"

  - local_id: test.ambiguous-severity-mix
    kind: BEHAVIORAL
    generated_by: MANUAL
    input:
      review_report:
        findings:
          - { severity: "major", category: "style" }
          - { severity: "minor", category: "logic" }
    assertion:
      kind: HUMAN_REVIEW               # Testing §9.2 — Outcome=PENDING_HUMAN_REVIEW até avaliação
      reviewer_role_class: role.governance-area.code-quality.human-lead
    covers: []
