# Subject: core/skill.static-analysis.code-review@1.0.0
# Tipo de registro: Decision Record, família Risk Acceptance (Governance §14 +
# §15; Compliance Architecture §4.7 — granularidade de Normative Requirement)
#
# Resolve a Non-Conformance real de fixture-secret-pattern.assessment.yaml.
# Primeira Risk Acceptance real do piloto, e primeiro caso real da regra
# adicionada em Compliance Architecture v1.1.0 (§4.4): Waiver/Risk Acceptance
# de nível NR agora propaga para BindingSatisfaction quando cobre TODO NR
# falho do grupo — antes desta emenda, este registro não teria efeito algum
# sobre o Binding, apesar de dispensar exatamente o único MUST que o violava.

subject: core/skill.static-analysis.code-review@1.0.0
verdict_ref: >
  records/compliance/fixture-secret-pattern.assessment.yaml
  #verdicts[nr_id=core/standard.code-quality.review-baseline@1.0.0#nr.no-hardcoded-secrets]

decisions:
  - subtype: RISK_ACCEPTANCE_GRANT
    granularity: NR                        # Compliance §4.7 — distinto de granularity: BINDING
                                             # (Ciclo 10, extended-pilot-strict-waiver.yaml)
    nr_id: "core/standard.code-quality.review-baseline@1.0.0#nr.no-hardcoded-secrets"
    reason: >
      Achado confirmado como valor de fixture de teste ("sk-test-00...", em
      tests/fixtures/sample_keys.py), usado para exercitar o próprio scanner
      de segredos — não uma credencial real, nunca esteve associado a
      nenhuma conta ou serviço ativo. Diferente de Waiver: não há remediação
      prometida — o valor É INTENCIONALMENTE um valor com forma de segredo
      e MUST permanecer assim para que o teste do scanner continue
      significativo. O que se aceita é o risco residual de manter esse
      padrão no repositório, não uma falha a corrigir.
    risk_classification:                    # Governance §14
      tier: BAIXO
      rationale: >
        Valor sem validade fora do repositório; escopo do arquivo é
        exclusivamente tests/fixtures/; nenhum caminho de execução em
        produção o consome. Risco residual é de falso-positivo em
        auditoria externa que não conheça o contexto, não de exposição real.
    effective_from: "2026-07-26T10:00:00Z"
    expires_at: "2027-07-26T10:00:00Z"        # prazo obrigatório mesmo sem remediação
                                                # prometida — Governance §15, sem exceção;
                                                # aqui funciona como ciclo de revalidação anual
    owner: role.governance-area.code-quality.steward
    closing_condition: >
      Revalidação anual: reconfirmar que o arquivo permanece um fixture de
      teste sem uso em produção. Não há condição de remediação, porque não
      há nada a remediar — closing_condition aqui é recorrência de revisão,
      não correção (distinção face ao Waiver do Ciclo 10, que fecha por
      remediação ou expiração).
    authorized_by: role.governance-area.code-quality.steward
    co_authorized_by: role.governance-area.code-quality.human-lead
    visibility: PUBLIC

# Recomputo de BindingSatisfaction após a Risk Acceptance (Compliance §4.4,
# regra v1.1.0) — mesma estrutura de comparação já usada em
# records/compliance/extended-pilot-strict-waiver.yaml (Ciclo 10).

binding_satisfaction_before:
  satisfied: false
  reason: NO_CLAIM_NON_CONFORMANT
  # estado registrado em fixture-secret-pattern.assessment.yaml, imutável —
  # este recomputo NÃO o edita retroativamente (CM7); é uma nova avaliação
  # do mesmo Binding, feita depois da Risk Acceptance existir.

binding_satisfaction_after:
  computed_at: "2026-07-26T10:05:00Z"
  binding:
    standard: core/standard.code-quality.review-baseline@1.0.0
    conformance_level: BASE
    conformance_mode: STRICT
    enforcement_mode: BLOCKING
    origin: "POLICY(core/policy.code-quality.mandatory-review@1.0.0)"
    precedence_level: DOMAIN
  satisfied: true                           # todo NR NON_CONFORMANT do grupo (só este) tem
                                              # waiver_ref ativo — regra v1.1.0
  reason: WAIVED
  waiver_ref: "this-record#decisions[0]"

# Nota (CM4, herdada sem alteração pela emenda v1.1.0): o Risk Acceptance
# acima MUST NOT alterar `ComplianceVerdict.outcome`, que permanece
# NON_CONFORMANT para sempre nesta Evidence — apenas `BindingSatisfaction`
# muda. A distinção auditável entre "não violou" e "violou, e o risco foi
# formalmente aceito" nunca é apagada, mesmo quando o resultado prático
# (dispatch prossegue) é idêntico ao de um Assessment limpo.
