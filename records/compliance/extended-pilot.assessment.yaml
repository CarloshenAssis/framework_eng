# Subject: Execution de step.run-code-review, sob core/policy.code-quality.extended-pilot
# Tipo de registro: Artifact, ComplianceReport (Compliance Architecture §4, §5)
#
# Segunda dispatch ilustrativa do mesmo Skill, agora depois de
# core/policy.code-quality.extended-pilot@1.0.0 entrar em vigência (17:00Z) e
# suprimir mandatory-review via `overrides`. Existe para dar um caso REAL a
# `ConformanceClaim{mode: PARTIAL}` e a `BindingSatisfaction` quando o Binding
# aceita Partial (`conformance_mode: PARTIAL_ACCEPTABLE`) — o ramo "aceito" de
# CM14. Ver `extended-pilot-strict-waiver.yaml` para o ramo "rejeitado".

assessment:
  assessment_id: "cmp-01J8Y3F92R6T8VBXMY1AD5SXC2"
  kind: RUNTIME
  subject: core/skill.static-analysis.code-review@1.0.0
  execution_context:
    orchestration_id: "wf-01J8Y3F90N4P6RVXMY9AD3SXA0"      # nova orquestração, PR distinto
    phase_id: phase.static-review
    step_id: step.run-code-review
    attempt: 0
    namespace_ancestry: [core]
  context_snapshot_id: "cs-01J8Y3F90N4P6RVXMY9AD3SXA0-0"
  evaluated_at: "2026-07-25T17:30:00Z"                       # após effective_from do piloto
  performed_by: role.system.compliance-service

effective_policy_set_ref: "eps-01J8Y3F90N4P6RVXMY9AD3SXA0"
resolution_trace:
  # Policy §11.1 — agora AMBAS as Policies de core/ passam nos filtros LIFECYCLE/TEMPORAL/
  # PLANE/SCOPE/CONDITION (Fase 2); a diferença com o Assessment anterior é só o relógio.
  candidates_considered:
    - core/policy.code-quality.mandatory-review@1.0.0
    - core/policy.code-quality.extended-pilot@1.0.0
  filtered_out: []
  suppressed_by_override:
    - [core/policy.code-quality.extended-pilot@1.0.0, core/policy.code-quality.mandatory-review@1.0.0]
    # Policy §7.3, Fase 3 do algoritmo — mandatory-review MUST NOT permanecer candidata
    # depois de suprimida; PL4 não bloqueia porque review-baseline é DOMAIN, não GLOBAL.
  conflicts_resolved: []                   # nada a resolver — só 1 Policy sobrevive à Fase 3
  standards_bound_merged:
    - standard: core/standard.code-quality.review-baseline@1.0.0
      level: EXTENDED
      merge_outcome: POLICY_STRONGER       # Kernel §2.14 (BASE) ∪ Policy-derivado (EXTENDED) —
                                             # EXTENDED ⊇ BASE (monotônico, Standards §4.4) prevalece,
                                             # mesma regra de Policy §7.5, agora com níveis DIFERENTES
                                             # (primeira vez no piloto que este ramo é exercitado)

verdicts:
  - nr_id: "core/standard.code-quality.review-baseline@1.0.0#nr.no-hardcoded-secrets"
    standard: core/standard.code-quality.review-baseline@1.0.0
    outcome: CONFORMANT
    evidence_ref: "ev-01J8Y3F90N4P6RVXMY9AD3SXA0-secrets"
    evidence:
      evidence_kind: STRUCTURAL
      description: "Varredura estática do diff revisado — nenhuma credencial ou chave detectada."
