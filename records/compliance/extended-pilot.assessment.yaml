      precedence_level: DOMAIN
    claim_ref: "cc-01J8Y3F90N4P6RVXMY9AD3SXA0-1"
    satisfied: true
    reason: CLAIM_PARTIAL_ACCEPTED          # Compliance §4.4, CM14 — claim.mode=PARTIAL E
