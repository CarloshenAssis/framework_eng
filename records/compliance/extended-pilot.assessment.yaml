    subject: core/skill.static-analysis.code-review@1.0.0
    standard: core/standard.code-quality.review-baseline@1.0.0
    level: EXTENDED
    mode: PARTIAL                          # todo MUST satisfeito, indeterminate=∅,
                                             # ao menos um SHOULD não satisfeito — Standards §8.2
    satisfied:
      - "core/standard.code-quality.review-baseline@1.0.0#nr.no-hardcoded-secrets"
    unsatisfied_should:
      - "core/standard.code-quality.review-baseline@1.0.0#nr.test-coverage-present"   # Standards ST8 — enumeração obrigatória
