      reproducible: true
    waiver_ref: null

  - nr_id: "core/standard.code-quality.review-baseline@1.0.0#nr.test-coverage-present"
    standard: core/standard.code-quality.review-baseline@1.0.0
    outcome: NON_CONFORMANT               # avaliado (evidência EXISTE), achado é negativo —
                                            # diferente de INDETERMINATE, que exigiria ausência de evidência
    evidence_ref: "ev-01J8Y3F90N4P6RVXMY9AD3SXA0-coverage"
    evidence:
      evidence_kind: TEST_RESULT
      description: >
        TestRunReport correlacionado ao diff revisado (Testing Architecture §6,
        Evidence{TEST_RESULT}): nenhum teste correspondente às linhas alteradas
        foi encontrado na suíte executada. Evidência de AUSÊNCIA de cobertura,
        não ausência de avaliação — por isso NON_CONFORMANT, não INDETERMINATE.
      test_run_id: "tr-01J8Y3F90N4P6RVXMY9AD3SXA0"
      outcome: FAIL
      reproducible: true
    waiver_ref: null                       # SHOULD não satisfeito não exige Waiver — Standards §8.2
                                            # já o declara "não bloqueante" nesse modo; ver Compliance §4.7

