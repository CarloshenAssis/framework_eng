# derives_from — RFC-DM-001 §3.3: fontes válidas = {Execution, Research,
# Decision, Knowledge}, grafo acíclico e temporalmente monotônico (Kernel §7,
# reaplicado). Aqui: duas Executions do próprio Ciclo 5 (ilustrativas —
# nenhuma Execution real ocorreu neste repositório, mesma ressalva de
# components/README.md e records/README.md).
derives_from:
