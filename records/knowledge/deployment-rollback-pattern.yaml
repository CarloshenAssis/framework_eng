  - "core/workflow.release-readiness@1.0.0:execution:01J9J8REVERT0000000000001"   # step.revert-deployment-record, Completed

established_at: "2026-07-25T18:00:00Z"
established_by: role.governance-area.code-quality.human-lead

statement: >
  Falhas em step.deploy que persistem após as 2 tentativas de RETRY
  configuradas (3 Executions no total) tendem a ter causa raiz fora do
  controle do próprio release — historicamente, infraestrutura do ambiente
  alvo. Compensação via reversão do registro de release (step.revert-
  deployment-record) é sempre segura de disparar automaticamente e MUST NOT
  ser adiada por decisão manual antes da reversão ocorrer; a decisão humana
  relevante é POSTERIOR à reversão (investigar a infraestrutura), não anterior.

